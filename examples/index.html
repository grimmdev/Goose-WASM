<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goose WASM - Live Native Demos</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #38bdf8;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    button.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
    .viewport {
      position: relative;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 1000px;
      height: 600px;
    }
    .status {
      margin-top: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #64748b;
    }
    .log-box {
      margin-top: 12px;
      width: 1000px;
      max-height: 120px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #a3e635;
      overflow-y: auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <header>
    <h1>Goose WebAssembly Live Demos</h1>
    <p>Real compiler-emitted C &bull; WebGL2 native renderer &bull; Box3D Physics &bull; Nuklear UI</p>
  </header>

  <div class="controls">
    <button id="btn-physics" class="active" onclick="switchDemo('physics')">28_physics_boxes (Box3D)</button>
    <button id="btn-cube" onclick="switchDemo('cube')">27_gfx_cube (WebGL2)</button>
    <button id="btn-ui" onclick="switchDemo('ui')">29_ui_todo (Nuklear UI)</button>
  </div>

  <div class="viewport">
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  <div class="status" id="status">Status: Initializing demo...</div>
  <div class="log-box" id="logBox">Logs will appear here...</div>

  <script type="module">
    let currentModule = null;

    const demos = {
      physics: {
        dir: '../build/g5_physics',
        args: ['goose_game', '--boxes', '1000', '--rate', '10'],
        w: 1280, h: 720
      },
      cube: {
        dir: '../build/g3_cube',
        args: ['goose_game'],
        w: 640, h: 480
      },
      ui: {
        dir: '../build/g4_ui',
        args: ['goose_game'],
        w: 760, h: 520
      }
    };

    window.switchDemo = async function(name) {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + name)?.classList.add('active');

      const statusEl = document.getElementById('status');
      const logBox = document.getElementById('logBox');
      const canvas = document.getElementById('canvas');

      const conf = demos[name];
      canvas.width = conf.w;
      canvas.height = conf.h;

      statusEl.textContent = `Status: Loading ${name}...`;
      logBox.textContent = `[Info] Loading ${name} from ${conf.dir}...\n`;

      try {
        const factory = (await import(`${conf.dir}/game.mjs`)).default;
        const mod = await factory({
          canvas,
          noInitialRun: true,
          print: (t) => {
            logBox.textContent += `[stdout] ${t}\n`;
            logBox.scrollTop = logBox.scrollHeight;
          },
          printErr: (t) => {
            logBox.textContent += `[stderr] ${t}\n`;
            logBox.scrollTop = logBox.scrollHeight;
          }
        });

        currentModule = mod;
        statusEl.textContent = `Status: Running ${name} at 60 FPS`;

        // Allocate argc/argv
        const args = conf.args;
        const ptrSize = 4;
        const argvPtr = mod._malloc((args.length + 1) * ptrSize);
        for (let i = 0; i < args.length; i++) {
          const len = mod.lengthBytesUTF8(args[i]) + 1;
          const argPtr = mod._malloc(len);
          mod.stringToUTF8(args[i], argPtr, len);
          mod.setValue(argvPtr + i * ptrSize, argPtr, 'i32');
        }
        mod.setValue(argvPtr + args.length * ptrSize, 0, 'i32');

        mod.ccall('goose_web_run', 'number', ['number', 'number'], [args.length, argvPtr], { async: true });
      } catch (err) {
        statusEl.textContent = `Status: Error - ${err.message}`;
        logBox.textContent += `[error] ${err.stack || err.message}\n`;
      }
    };

    // Auto-start physics demo on load
    window.addEventListener('DOMContentLoaded', () => {
      window.switchDemo('physics');
    });
  </script>
</body>
</html>
