<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goose WASM - Live Native Demos</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #38bdf8;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    button.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
    .viewport {
      width: min(1000px, 100%);
      position: relative;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 1000px;
      height: 600px;
    }
    .status {
      margin-top: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #64748b;
    }
    .log-box {
      margin-top: 12px;
      width: min(1000px, 100%);
      max-height: 160px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #a3e635;
      overflow-y: auto;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <header>
    <h1>Goose WebAssembly Live Demos</h1>
    <p>Compiled Goose &bull; WebGL2 &bull; Box3D &bull; Nuklear UI &bull; Escape exits • 2D: arrows/stick move, click/tap/A jumps</p>
  </header>

  <div class="controls">
    <button id="btn-physics" class="active" onclick="switchDemo('physics')">28_physics_boxes (Box3D)</button>
    <button id="btn-cube" onclick="switchDemo('cube')">27_gfx_cube (WebGL2)</button>
    <button id="btn-ui" onclick="switchDemo('ui')">29_ui_todo (Nuklear UI)</button>
  <button id="btn-minecraft" onclick="switchDemo('minecraft')">30_mini_minecraft</button>
<button id="btn-doom" onclick="switchDemo('doom')">31_mini_doom / Freedoom</button>
<button id="btn-planar2d" onclick="switchDemo('planar2d')">2D sprites + planar physics</button>
</div>

  <p id="demo-help" style="max-width:1000px;margin:0 0 12px;line-height:1.5"></p>
  <div class="viewport">
    <iframe id="demo-frame" title="Goose demo" style="display:block;width:1000px;max-width:100%;height:600px;border:0"></iframe>
  </div>

  <div class="status" id="status">Status: Initializing demo...</div>
  <div class="log-box" id="logBox">Logs will appear here...</div>

  <script type="module" src="index.mjs"></script>
<p style="margin-top:12px"><a style="color:#94a3b8" href="licenses/Freedoom-COPYING.adoc">Freedoom license</a> · <a style="color:#94a3b8" href="licenses/Freedoom-CREDITS">Freedoom credits</a></p>
</body>
</html>
