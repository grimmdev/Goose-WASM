name: Deploy Goose demos to Pages

# Called only by the manually dispatched build-wasm.yml after successful tests.
# Uses that same run's artifact; it never rebuilds from a moving branch.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time, including different manual releases.
concurrency:
  group: goose-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy tested static artifact from this workflow run
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
