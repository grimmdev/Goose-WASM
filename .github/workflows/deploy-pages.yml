name: Deploy Goose demos to Pages

# Called by build-wasm.yml after its tagged build/tests succeed.
# No second tag trigger: that would rebuild or race the first workflow.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time, including different release tags.
concurrency:
  group: goose-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy tested static artifact from this workflow run
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
