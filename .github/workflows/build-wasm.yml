name: Build & Publish Goose WebAssembly

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish package to GitHub Packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Goose WASM
    # Pin the image so ubuntu-latest cannot move this build to a new distro.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.70

      - name: Verify Emscripten Installation
        run: |
          emcc --version
          em++ --version

      - name: Make Build Script Executable
        run: chmod +x scripts/build.sh

      - name: Build WebAssembly Module
        run: ./scripts/build.sh goose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@grimmdev'

      - name: Install Build Dependencies
        run: npm install --ignore-scripts

      - name: Build Native Web Static Libraries
        run: |
          node scripts/build-web-libs.cjs

      - name: Bundle TypeScript API & WebGL Renderer
        run: node scripts/bundle.cjs

      - name: Build Pinned Shader Translator
        run: npm run build:shader-tools

      - name: Build Official Goose Demos
        run: npm run build:demos && npm run build:browser-probes

      - name: Install Chromium for Real WebGL Tests
        # GitHub-hosted Ubuntu provides Chromium's runtime libraries.
        # Do not use --with-deps here: it invokes apt for additional packages
        # and caused the Ubuntu mirror DNS failure in the supplied log.
        run: npx --no-install playwright install chromium

      - name: Run Package Integration & Acceptance Tests
        run: npm test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goose-wasm-dist
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
